<!--
REVIEW GUIDE
Purpose: the student-facing tutoring page, including layout, lesson rendering,
stage navigation, and local grading of final-practice answers.
- 25-281: CSS. The page/base layout starts at 26; prompt/output styling at 115;
  lesson and question cards at 162; grading feedback styles at 270.
- 283-302: page structure. The form is #searchForm, the prompt is #userInput,
  and generated lesson/error output is #output.
- 304: loads OpenAi.js, which provides AskOpenAi, isAnswerCorrect, and QUIZ_COUNTS.
- 305-319: page-script setup and escapeHtml, which escapes model text before HTML insertion.
- 321-406: renderQuiz validates the expected response shape, builds the lesson stages,
  wires stage navigation, and attaches local final-answer grading.
- 408-437: form submit handler; sends the prompt through AskOpenAi and displays
  loading, generated lesson, or error feedback.
For generation/validation rules, see OpenAi.js; run `npm test` for regression checks.
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alla AI — Math-first study tutor</title>
    <style>
        /* Brand tokens and base page layout. */
        /* Shared color/spacing decisions begin here; update tokens to theme the whole page. */
        :root {
            color-scheme: dark;
            --brand-green: #00ff0d;
            --bg: #07090b;
            --panel: rgb(25,25,25);
            --panel-border: rgb(0,155,13);
            --text: #f7f8f5;
            --muted: #99a18a;
            --danger: #ff4d4d;
            --success: #3ae27a;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100vh;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            position: relative;
            padding: 90px 18px 32px;
            display: flex;
            justify-content: center;
        }

        .topbar {
            position: absolute;
            top: 18px;
            right: 18px;
            left: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .topbar img {
            width: 140px;
            max-width: 160px;
            object-fit: contain;
            display: block;
        }

        .header-text {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding-top: 10px;
        }

        .title {
            color: #ffffff;
            font-family: "Segoe UI", Arial, sans-serif;
            font-size: 300%;
            text-align: center;
            margin: 0;
        }

        .subtitle {
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.5;
            margin: 0;
            text-align: center;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .nav-buttons .nav-link {
            padding: 10px 16px;
            border-radius: 999px;
            background: rgb(25,25,25);
            border: 1px solid rgb(25,25,25);
            color: var(--text);
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .nav-buttons .nav-link:hover {
            background: rgba(0,155,13);
            transform: translateY(-1px);
        }

        .nav-buttons .nav-link[aria-current="page"] {
            border-color: var(--brand-green);
            color: var(--brand-green);
        }

        .page-body {
            width: min(700px, 100%);
            display: grid;
            gap: 20px;
            margin-top: 5vh;
        }

        /* Prompt entry and initial response region. */
        /* Keep the input and output full-width within the centered page column. */
        #searchForm {
            padding: 28px;
            display: grid;
            justify-items: center;
            border: 1px solid var(--panel-border);
            border-radius: 32px;
            gap: 18px;
        }

        #searchForm input {
            width: 100%;
            padding: 18px 22px;
            border-radius: 18px;
            border: 1px solid rgb(255,255,255);
            background: #0c1015;
            color: var(--text);
            font-size: 1rem;
        }

        #searchForm input::placeholder {
            color: rgb(255,255,255);
        }

        #submitButton {
            min-width: 128px;
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid #8aff91;
            background: var(--brand-green);
            color: #050607;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        output {
            width: 100%;
            padding: 24px;
            border-radius: 28px;
            border: 1px solid rgb(0,155,13);
            background: #090b0f;
            color: #e6ffe6;
            min-height: 130px;
            display: block;
        }

        /* Lesson navigation, review material, and question cards. */
        /* Navigation buttons and .lesson-page.active must stay in sync in renderQuiz. */
        .lesson-shell { display: grid; gap: 22px; }
        .lesson-nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .lesson-nav button { padding: 10px 8px; border: 1px solid rgba(255,255,255,0.18); border-radius: 10px; background: #151b20; color: var(--text); cursor: pointer; }
        .lesson-nav button.active { border-color: var(--brand-green); color: var(--brand-green); }
        .lesson-page { display: none; gap: 16px; }
        .lesson-page.active { display: grid; }
        .lesson-page h3 { margin: 0; color: var(--brand-green); }
        .lesson-page p { margin: 0; line-height: 1.6; }
        .formula-list, .step-list { margin: 0; padding-left: 22px; line-height: 1.7; }
        .guided-card, .practice-card { padding: 16px; border: 1px solid rgba(255,255,255,0.14); border-radius: 14px; background: rgba(12,16,21,0.8); }
        .practice-card { display: grid; gap: 7px; }
        .practice-answer { color: var(--muted); font-size: 0.82rem; }
        .final-feedback { min-height: 1.4em; color: var(--muted); }
        .check-answers-button {
            justify-self: start;
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 12px 18px;
            border: 1px solid #8aff91;
            border-radius: 12px;
            background: var(--brand-green);
            color: #050607;
            box-shadow: 0 5px 0 #008c0b, 0 10px 24px rgba(0, 255, 13, 0.16);
            font-weight: 800;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }
        .check-answers-button::before {
            content: "[ ]";
            font-size: 0.8rem;
            font-weight: 900;
        }
        .check-answers-button:hover {
            background: #7dff85;
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #008c0b, 0 14px 28px rgba(0, 255, 13, 0.2);
        }
        .check-answers-button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #008c0b, 0 5px 14px rgba(0, 255, 13, 0.14);
        }
        .check-answers-button:focus-visible {
            outline: 3px solid #ffffff;
            outline-offset: 3px;
        }
        @media (max-width: 560px) {
            /* Collapse lesson navigation and reduce page spacing for narrow screens. */
            .lesson-nav { grid-template-columns: repeat(2, 1fr); }
            .title { font-size: 2.1rem; }
            .topbar { top: 14px; right: 12px; left: 12px; }
            .topbar img { width: 112px; }
            body { padding-right: 12px; padding-left: 12px; }
            #searchForm { padding: 20px 16px; }
            output { padding: 18px; }
        }

        .quiz-wrap {
            display: grid;
            gap: 18px;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .quiz-header h3 {
            margin: 0;
            font-size: 1.3rem;
        }

        .quiz-header button {
            border: none;
            border-radius: 12px;
            padding: 10px 14px;
            background: var(--brand-green);
            color: #050607;
            font-weight: 700;
            cursor: pointer;
        }

        .quiz-question {
            display: grid;
            gap: 8px;
            margin-bottom: 8px;
        }

        .quiz-question label {
            color: #e6ffe6;
            line-height: 1.5;
        }

        .answer-input {
            width: 100%;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.25);
            background: rgba(12,16,21,0.9);
            color: var(--text);
            padding: 12px 14px;
            font-size: 1rem;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        /* Local grading feedback states. */
        /* These classes are applied to answer inputs by the Check Answers handler. */
        .answer-input.correct {
            border-color: var(--success);
            background: rgba(58, 226, 122, 0.14);
        }

        .answer-input.incorrect {
            border-color: var(--danger);
            background: rgba(255, 77, 77, 0.14);
        }
    </style>
</head>

<body>
    <!-- Static navigation and prompt controls; the script below looks up these IDs. -->
    <div class="topbar">
        <img src="https://i.imgur.com/HvQ6wZ6.png" alt="Logo">
        <div class="nav-buttons">
            <a class="nav-link" href="index.html" aria-current="page">Home</a>
            <a class="nav-link" href="About.html">About</a>
        </div>
    </div>

    <div class="page-body">
        <div class="header-text">
            <h1 class="title">Alla AI — Tutoring</h1>
            <p class="subtitle">Math comes first, and other academic subjects are welcome too.</p>
        </div>
        <form id="searchForm">
            <!-- The submit handler reads this value and sends it through AskOpenAi. -->
            <input type="text" id="userInput" placeholder="Enter your input here">
            <button type="submit" id="submitButton">Submit</button>
        </form>

        <!-- Status messages and the generated lesson are rendered into this element. -->
        <output id="output">This is where your output will be.</output>
    </div>

    <script src="OpenAi.js"></script>
    <script>
        var form = document.getElementById("searchForm");
        var input = document.getElementById("userInput");
        var output = document.getElementById("output");

        // Model content is untrusted; escape it before composing the lesson HTML.
        function escapeHtml(value) {
            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        // Render only a complete response matching the same counts enforced by the server.
        function renderQuiz(quizData) {
            // Guard every required question set before mapping it into lesson markup.
            if (!quizData || !quizData.review || !Array.isArray(quizData.review.prerequisites) || !quizData.review.prerequisites.length ||
                !Array.isArray(quizData.questions) || !Array.isArray(quizData.finalQuestions) ||
                !Array.isArray(quizData.moreQuestions) ||
                quizData.questions.length !== QUIZ_COUNTS.practicePerPage ||
                quizData.moreQuestions.length !== QUIZ_COUNTS.practicePerPage ||
                quizData.finalQuestions.length !== QUIZ_COUNTS.final) {
                output.innerHTML = "<p>I couldn’t build a lesson from that response. Please try again.</p>";
                return;
            }
            var subjectTitle = escapeHtml(quizData.subject || "Study Topic");
            var review = quizData.review;
            var prerequisites = (review.prerequisites || []).map(function (item) { return "<li>" + escapeHtml(item) + "</li>"; }).join("");
            var formulas = (review.formulas || []).map(function (formula) { return "<li>" + escapeHtml(formula) + "</li>"; }).join("");
            var guidedSteps = (review.guidedProblem.steps || []).map(function (step) { return "<li>" + escapeHtml(step) + "</li>"; }).join("");
            // Practice pages show answers for learning; final-practice answers stay hidden for grading.
            // Guided questions reveal answers immediately; final questions are graded interactively below.
            var guidedItems = quizData.questions.map(function (item) {
                return "<div class=\"practice-card\"><strong>" + escapeHtml(item.question) + "</strong><small class=\"practice-answer\">Answer: " + escapeHtml(item.answer) + "</small></div>";
            });
            var morePracticeItems = quizData.moreQuestions.map(function (item) {
                return "<div class=\"practice-card\"><strong>" + escapeHtml(item.question) + "</strong><small class=\"practice-answer\">Answer: " + escapeHtml(item.answer) + "</small></div>";
            });
            var finalItems = quizData.finalQuestions.map(function (item, index) {
                return `<div class="quiz-question">
                    <label for="final-answer-${index}">${index + 1}. ${escapeHtml(item.question)}</label>
                    <input id="final-answer-${index}" class="answer-input" type="text" data-index="${index}" placeholder="Type your answer">
                    <small class="final-feedback" id="final-feedback-${index}"></small>
                </div>`;
            }).join("");

            output.innerHTML = `
                <div class="lesson-shell">
                    <div class="quiz-header"><h3>${subjectTitle}</h3></div>
                    <div class="lesson-nav">
                        <button class="active" data-page="review-page">1. Review</button>
                        <button data-page="guided-page">2. Guided Practice</button>
                        <button data-page="guided-page-2">3. More Practice</button>
                        <button data-page="final-page">4. Final Practice</button>
                    </div>
                    <section id="review-page" class="lesson-page active">
                        <h3>Review</h3>
                        <p>${escapeHtml(review.summary)}</p>
                        <div class="guided-card">
                            <strong>Prerequisite refresh</strong>
                            <ul class="formula-list">${prerequisites}</ul>
                        </div>
                        <ul class="formula-list">${formulas}</ul>
                        <div class="guided-card">
                            <strong>Guided problem: ${escapeHtml(review.guidedProblem.prompt)}</strong>
                            <ol class="step-list">${guidedSteps}</ol>
                            <small class="practice-answer">Answer: ${escapeHtml(review.guidedProblem.answer)}</small>
                        </div>
                    </section>
                    <section id="guided-page" class="lesson-page">
                        <h3>Guided Practice</h3>
                        ${guidedItems.join("")}
                    </section>
                    <section id="guided-page-2" class="lesson-page">
                        <h3>More Practice</h3>
                        ${morePracticeItems.join("")}
                    </section>
                    <section id="final-page" class="lesson-page">
                        <h3>Final Practice</h3>
                        <button type="button" class="check-answers-button" id="gradeQuizButton">Check Answers</button>
                        ${finalItems}
                    </section>
                </div>`;

            // data-page values in these buttons must match the corresponding section IDs below.
            // Keep only one lesson stage visible at a time.
            output.querySelectorAll(".lesson-nav button").forEach(function (button) {
                button.addEventListener("click", function () {
                    output.querySelectorAll(".lesson-nav button, .lesson-page").forEach(function (element) { element.classList.remove("active"); });
                    button.classList.add("active");
                    document.getElementById(button.dataset.page).classList.add("active");
                });
            });

            // Grade each final answer locally so the student gets immediate feedback.
            document.getElementById("gradeQuizButton").addEventListener("click", function () {
                output.querySelectorAll(".answer-input").forEach(function (field) {
                    // data-index maps each input back to the expected answer in finalQuestions.
                    var questionIndex = Number(field.dataset.index);
                    var expectedAnswer = quizData.finalQuestions[questionIndex]?.answer || "";
                    var feedback = document.getElementById("final-feedback-" + questionIndex);
                    field.classList.remove("correct", "incorrect");
                    if (!field.value.trim()) { feedback.textContent = "Enter an answer to check it."; return; }
                    var correct = isAnswerCorrect(field.value, expectedAnswer);
                    field.classList.add(correct ? "correct" : "incorrect");
                    feedback.textContent = correct ? "Correct" : "Answer: " + expectedAnswer;
                });
            });
        }

        // Send one prompt at a time through the same-origin local/server API.
        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            // Trim before sending so blank/space-only requests never reach the model.
            var userInput = input.value.trim();

            if (!userInput) {
                output.textContent = "Please enter a question or prompt first.";
                return;
            }

            output.textContent = "Thinking...";

            try {
                // AskOpenAi uses the same-origin server in browsers and returns a lesson or error.
                var result = await AskOpenAi(userInput);

                if (result && Array.isArray(result.questions) && result.questions.length > 0) {
                    renderQuiz(result);
                    return;
                }

                output.textContent = result && result.error ? "OpenAI error: " + result.error : "I couldn’t generate a quiz for that prompt. Please try a clearer academic question or topic.";
            } catch (error) {
                output.textContent = "Error: " + (error.message || "Request failed");
            }
        });
    </script>
</body>

</html>
