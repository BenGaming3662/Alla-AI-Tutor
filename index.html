<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Alla AI: Math Tutoring</title>
    <style>
        :root {
            color-scheme: dark;
            --brand-green: #00ff0d;
            --bg: #07090b;
            --panel: rgb(25,25,25);
            --panel-border: rgb(0,155,13);
            --text: #f7f8f5;
            --muted: #99a18a;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100vh;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            position: relative;
            padding: 90px 18px 32px;
            display: flex;
            justify-content: center;
        }

        

        .topbar img {
            width: 140px;
            max-width: 160px;
            object-fit: contain;
            display: block;
           left: 20px;
            position: fixed;
            top: 20px;
            
        }

        .header-text {
            display: flex;
            justify-content: center;
            padding-top: 10px;
        }

        .title {
            color: #ffffff;
            font-family: "Segoe UI", Arial, sans-serif;
            font-size: 300%;
            text-align: center;
            margin: 0;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            position: fixed;

            top: 10px;
           left: 88%;
            display: flex;
            align-items: center;
          
        }

        .nav-buttons button {
            padding: 10px 16px;
            border-radius: 999px;
            background: rgb(25,25,25);
            border: 1px solid rgb(25,25,25);
            color: var(--text);
            cursor: pointer;
      
        }

        .nav-buttons button:hover {
            background: rgba(0,155,13);
            transform: translateY(-1px);
        }

        .nav-buttons a {
            color: inherit;
            text-decoration: none;
            display: inline-block;
        }

        .page-body {
            width: min(700px, 100%);
            display: grid;
            gap: 20px;
            margin-top: 5vh;
        }

        #searchForm {
            padding: 28px;
            display: grid;
            justify-items: center;
            border: 1px solid var(--panel-border);
            border-radius: 32px;
            gap: 18px;
        }

        #searchForm input {
            width: 100%;
            padding: 18px 22px;
            border-radius: 18px;
            border: 1px solid rgb(255,255,255);
            background: #0c1015;
            color: var(--text);
            font-size: 1rem;
        }

        #searchForm input::placeholder {
            color: rgb(255,255,255);
        }

        #submitButton {
            width: 20%;
           
            padding: 2%;
            border-radius: 12px;
            background: var(--brand-green);
            color: #050607;
            font-weight: 700;
            cursor: pointer;
        }

     

        output {
            width: 100%;
            padding: 24px;
            border-radius: 28px;
            border: 1px solid rgb(0,155,13);
            background: #090b0f;
            color: #e6ffe6;
            min-height: 130px;
            display: block;
        }
    </style>
</head>

<body>
    <div class="topbar">
        <img src="https://i.imgur.com/HvQ6wZ6.png" alt="Logo">
        <div class="nav-buttons">
            <button><a href="index.html">Home</a></button>
            <button><a href="About.html">About</a></button>
        </div>
    </div>

    <div class="page-body">
        <div class="header-text">
            <div class="title">Alla AI: Math Tutoring</div>
        </div>
        <form id="searchForm">
            <input type="text" id="userInput" placeholder="Enter your input here">
            <button type="submit" id="submitButton">Submit</button>
        </form>

        <output id="output">This is where your output will be.</output>
    </div>

    <script src="secrets.js"></script>
    <script src="OpenAi.js"></script>
    <script>
        var form = document.getElementById("searchForm");
        var input = document.getElementById("userInput");
        var output = document.getElementById("output");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();
            var userInput = input.value.trim();
            if (!userInput) {
                output.textContent = "Please enter a question or prompt first.";
                return;
            }

            output.textContent = "Thinking...";
            try {
                var result = await AskOpenAi(userInput);
                output.textContent = result;
            } catch (error) {
                output.textContent = "Error: " + (error.message || "Request failed");
            }
        });
    </script>
</body>

</html>
